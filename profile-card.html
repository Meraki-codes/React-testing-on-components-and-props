<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile Card</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      body {
        margin: 0 auto;
        padding: 30px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f2f4f7;
      }
      h1 {
        text-align: center;
        margin-bottom: 12px;
      }
      .profile-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
      }
      .profile-card {
        background: white;
        width: 220px;
        padding: 20px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      .profile-card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }
      .profile-card h2 {
        margin: 12px 0 4px;
        font-size: 20px;
      }
      .profile-card p {
        margin: 4px 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="root"></div>

    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.development.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      function ProfileCard({ name, course, level, image }) {
        return (
          <div className="profile-card">
            <img src={image} alt={name} />
            <h2>{name}</h2>
            <p>{course}</p>
            <p>{level}</p>
          </div>
        );
      }

      function App() {
        return (
          <>
            <h1>Student Profiles</h1>
            <div className="profile-cards">
              <ProfileCard
                name="Ada"
                course="Mechatronics Engineering"
                level="200 level"
                image="https://picsum.photos/seed/ada/200"
              />
              <ProfileCard
                name="Tunde"
                course="Mechanical Engineering"
                level="300 level"
                image="https://picsum.photos/seed/tunde/200"
              />
              <ProfileCard
                name="Chioma"
                course="Electrical Engineering"
                level="400 level"
                image="https://picsum.photos/seed/chioma/200"
              />
            </div>
          </>
        );
      }
      const container = document.querySelector(".root");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
